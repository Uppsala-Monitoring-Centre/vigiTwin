[project]
name = "llm-dup-dev"
version = "1.0.2"
description = "LLM duplicate detection development utilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jinja2>=3.1",
    # Reviewer/arbitration workbooks (study_eval.scle.workbook / arbitration).
    # Core, not an extra: study_eval imports it at module level and is a
    # documented entry point, so `pip install llm-dup-dev` must be enough.
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_dup_dev"]

# ---------------------------------------------------------------------------
# Lint and type-check configuration.
#
# The rule selection is explicit rather than left to the tool default, so that
# a check run here, in CI, and on a contributor's clone all agree regardless of
# which ruff version is installed — before this config existed, they did not.
#
# Both checks BLOCK in CI (see .github/workflows/ci.yml) and both report zero
# findings as of 1.0.1. They were advisory through 1.0.0, which deliberately
# changed no `src/`; the 36 ruff and 33 mypy findings inherited from that were
# cleared in 1.0.1 and the checks turned blocking in the same change, since an
# advisory check nobody has to satisfy stops being a check.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["_reference_secure_side", ".venv", "dist", "outputs"]

[tool.ruff.lint]
# Deliberately narrow: rules that find defects, not rules that express
# formatting preferences. pyflakes (F) plus the pycodestyle error subsets, plus
# flake8-bugbear (B) for the two bug classes pyflakes misses — B905 (`zip`
# without `strict=`, which truncates silently) and B023 (a closure not binding
# its loop variable).
#
# The wider selection this started as (adding I, UP, SIM and the rest of RUF)
# reported 222 findings, of which about 195 were import ordering, `__all__`
# sorting and annotation modernization — no defects among them. At that volume
# a blocking check is unaffordable and an advisory one is noise. At 36 it was a
# list someone could actually clear, which is what happened in 1.0.1 — and a
# narrow blocking check prevents regressions, where a broad advisory one does
# not.
#
# Widening later is this one line. If you widen, do it in the same change that
# clears what the new rules report, so the job stays green.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# pytest passes fixtures as parameters, which ruff reads as redefining the
# fixture function. All 72 occurrences are this pattern; no test is shadowed.
"tests/**" = ["F811"]

[tool.mypy]
python_version = "3.11"
files = ["src/llm_dup_dev"]
