[project]
name = "vigitwin"
version = "1.3.0"
description = "Duplicate adjudication for pharmacovigilance adverse event reports"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# PEP 639: an SPDX expression plus the files to ship, not a classifier.
# `NOTICE` is not decoration — Apache-2.0 section 4(d) requires redistributing
# it, and before 1.3.0 the wheel shipped neither file. A `License ::`
# classifier must NOT be added alongside this: PEP 639 supersedes them and
# PyPI rejects an upload carrying both.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "G. Niklas Norén" }]
maintainers = [{ name = "Uppsala Monitoring Centre" }]
keywords = [
    "pharmacovigilance",
    "duplicate detection",
    "record linkage",
    "adverse drug reactions",
    "large language models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1",
    # Reviewer/arbitration workbooks (study_eval.scle.workbook / arbitration).
    # Core, not an extra: study_eval imports it at module level and is a
    # documented entry point, so `pip install vigitwin` must be enough.
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Uppsala-Monitoring-Centre/vigiTwin"
Repository = "https://github.com/Uppsala-Monitoring-Centre/vigiTwin"
Changelog = "https://github.com/Uppsala-Monitoring-Centre/vigiTwin/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Uppsala-Monitoring-Centre/vigiTwin/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
# Floor pinned, not left open: PEP 639 licensing (the `license` expression and
# `license-files` above) landed in hatchling 1.27, and an older backend
# silently falls back to the legacy PEP 621 reading and emits different
# metadata. An unpinned backend is how two builds of one commit disagree.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigitwin"]

# An allowlist, not a denylist, and not a delegation to .gitignore. The
# repository root holds two directories that must never reach a public
# artifact — `_reference_secure_side/` (secure-side reference material) and
# `outputs/` (rendered review HTML over whatever was last run) — plus a
# `dist/` that is ignored only by its own nested .gitignore, which hatchling
# does not read. A denylist protects those only for as long as someone
# remembers to extend it; `only-include` inverts the default, so adding a
# directory to the repository cannot add it to a release. The forbidden-path
# assertion in .github/workflows/release.yml is the second lock, on the built
# artifact rather than on this configuration.
#
# `tests` and `scripts` are in deliberately: the README's claim that the full
# suite runs on a clean install, and the docs' references to
# `scripts/study_eval_demo.py`, both have to hold for someone who only has
# the sdist.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/vigitwin",
    "tests",
    "schemas",
    "examples",
    "docs",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "NOTICE",
    "agents.md",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.DS_Store",
]

# ---------------------------------------------------------------------------
# Lint and type-check configuration.
#
# The rule selection is explicit rather than left to the tool default, so that
# a check run here, in CI, and on a contributor's clone all agree regardless of
# which ruff version is installed — before this config existed, they did not.
#
# Both checks BLOCK in CI (see .github/workflows/ci.yml) and both report zero
# findings as of 1.0.1. They were advisory through 1.0.0, which deliberately
# changed no `src/`; the 36 ruff and 33 mypy findings inherited from that were
# cleared in 1.0.1 and the checks turned blocking in the same change, since an
# advisory check nobody has to satisfy stops being a check.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["_reference_secure_side", ".venv", "dist", "outputs"]

[tool.ruff.lint]
# Deliberately narrow: rules that find defects, not rules that express
# formatting preferences. pyflakes (F) plus the pycodestyle error subsets, plus
# flake8-bugbear (B) for the two bug classes pyflakes misses — B905 (`zip`
# without `strict=`, which truncates silently) and B023 (a closure not binding
# its loop variable).
#
# The wider selection this started as (adding I, UP, SIM and the rest of RUF)
# reported 222 findings, of which about 195 were import ordering, `__all__`
# sorting and annotation modernization — no defects among them. At that volume
# a blocking check is unaffordable and an advisory one is noise. At 36 it was a
# list someone could actually clear, which is what happened in 1.0.1 — and a
# narrow blocking check prevents regressions, where a broad advisory one does
# not.
#
# Widening later is this one line. If you widen, do it in the same change that
# clears what the new rules report, so the job stays green.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# pytest passes fixtures as parameters, which ruff reads as redefining the
# fixture function. All 72 occurrences are this pattern; no test is shadowed.
"tests/**" = ["F811"]

[tool.mypy]
python_version = "3.11"
files = ["src/vigitwin"]
