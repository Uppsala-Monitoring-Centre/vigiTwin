[project]
name = "llm-dup-dev"
version = "0.1.0"
description = "LLM duplicate detection development utilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "umc-research>=2.6.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_dup_dev"]
