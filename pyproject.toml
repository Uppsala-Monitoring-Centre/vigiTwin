[project]
name = "llm-dup-dev"
version = "1.0.0"
description = "LLM duplicate detection development utilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jinja2>=3.1",
    # Reviewer/arbitration workbooks (study_eval.scle.workbook / arbitration).
    # Core, not an extra: study_eval imports it at module level and is a
    # documented entry point, so `pip install llm-dup-dev` must be enough.
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_dup_dev"]
